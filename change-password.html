<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password — Served.</title>
<meta name="description" content="Set a new Served. password.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/a11y.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="auth">

<main class="auth auth--solo" id="main">
  <div>
    <img class="auth__logo auth__logo--solo" style="margin-inline:auto;display:block" src="assets/img/logo-served.png" alt="Served.">

    <form class="auth-card auth-card--solo" data-auth="change" novalidate>
      <h1>Change Password</h1>
      <p class="sub">Your new password must be different from<br>&nbsp;previous used password</p>

      <div>
        <div class="auth-field">
          <label class="sr-only" for="f-new">New password</label>
          <input id="f-new" type="password" placeholder="New Password" autocomplete="new-password" data-rule="f-new">
          <button class="tail" type="button" data-toggle-pw="f-new"></button>
        </div>
        <span class="auth-err"></span>
      </div>

      <div>
        <div class="auth-field">
          <label class="sr-only" for="f-new2">Confirm password</label>
          <input id="f-new2" type="password" placeholder="Confirm Password" autocomplete="new-password" data-match="f-new">
          <button class="tail" type="button" data-toggle-pw="f-new2"></button>
        </div>
        <span class="auth-err"></span>
      </div>

      <button class="btn btn--orange auth-submit" type="submit">
        Change Password
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M13 9.5l2.5 2.5L13 14.5"/></svg>
      </button>
    </form>

    <p class="auth-foot auth-foot--solo"><a href="account.html">Back to My Account</a></p>
  </div>
</main>

<style>.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
