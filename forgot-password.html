<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — Served.</title>
<meta name="description" content="Reset your Served. password.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/a11y.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="auth">

<main class="auth auth--solo" id="main">
  <div>
    <form class="auth-card auth-card--solo" data-auth="forgot" novalidate>
      <h1>Forgot Password</h1>
      <p class="sub">Enter registered email</p>

      <div>
        <div class="auth-field">
          <label class="sr-only" for="f-email">Email</label>
          <input id="f-email" type="email" placeholder="Email" autocomplete="email" data-rule="f-email">
          <span class="tail" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.2"/><path d="m3.6 7 8.4 6 8.4-6"/></svg></span>
        </div>
        <span class="auth-err"></span>
      </div>

      <button class="btn btn--orange auth-submit" type="submit">
        Submit
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M13 9.5l2.5 2.5L13 14.5"/></svg>
      </button>
    </form>

    <p class="auth-foot auth-foot--solo">Remember Password? <a href="signin.html">Sign In!</a></p>
  </div>
</main>

<style>.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
